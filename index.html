<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Booking</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="navbar">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="#habitaciones">Habitaciones</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#reservas">Reservas</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>

      <!-- Área dinámica para usuario -->
      <div id="auth-section">
        <button id="login-btn">Iniciar sesión</button>
      </div>
    </nav>

    <!-- Hero -->
    <section class="flex flex-col items-center justify-center h-[80vh] text-center px-6">
      <h2 class="text-4xl font-bold mb-4">Reserva tu habitación ideal</h2>
      <p class="text-lg mb-6 max-w-xl">
        Explora las mejores opciones de alojamiento y disfruta una experiencia única con nuestro sistema de reservas.
      </p>
      <a href="pages/dashboard.html" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
        Ver habitaciones
      </a>
    </section>

    <!-- Sección de reservas -->
    <section id="reservas" class="px-8 py-12 bg-white shadow-md rounded-lg max-w-lg mx-auto">
      <h2 class="text-2xl font-semibold mb-4 text-center">Reserva tu habitación</h2>

      <form id="reserva-form" class="flex flex-col gap-4">
        <label>Nombre completo:</label>
        <input type="text" id="nombre" required class="border p-2 rounded">

        <label>Tipo de habitación:</label>
        <select id="tipo-habitacion" required class="border p-2 rounded">
          <option value="">Selecciona</option>
          <option value="suite">Suite</option>
          <option value="doble">Doble</option>
          <option value="sencilla">Sencilla</option>
        </select>

        <label>Fecha de entrada:</label>
        <input type="date" id="fecha-inicio" required class="border p-2 rounded">

        <label>Fecha de salida:</label>
        <input type="date" id="fecha-fin" required class="border p-2 rounded">

        <button type="submit" class="bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
          Reservar
        </button>
      </form>
    </section>

    <script src="script.js"></script>
  </body>
</html>
